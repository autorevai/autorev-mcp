# Publish this server to the official MCP Registry.
#
# Why this exists. The registry listing is the door to Anthropic's connectors directory, and
# claude.com/connectors is a DR 80 dofollow that our competitor quo.com holds and we do not.
# It has been one command away since server.json was written, and it stayed undone because the
# documented path is `mcp-publisher login github`, a browser device flow that nobody was at a
# terminal to complete.
#
# `login github-oidc` removes that. GitHub Actions mints an OIDC token, the publisher exchanges
# it, and the `io.github.autorevai/*` namespace is authenticated by the fact that this workflow
# runs in the autorevai org. No browser, no device code, no stored credential.
#
# npm publishing here uses TRUSTED PUBLISHING, so there is no token to create, paste or rotate.
# npm mints an OIDC token per run from the same `id-token: write` permission the registry step
# already needs. Classic npm tokens were invalidated on 2025-12-09, so a token would have to be a
# granular one anyway, and a credential nobody has to store is better than one somebody does.
#
# ONE-TIME SETUP, and it is a settings page rather than a secret:
#   npmjs.com -> @autorevai/mcp-server -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user:  autorevai      (case-sensitive)
#     Repository:            autorev-mcp
#     Workflow filename:     publish-mcp.yml   <- must match this file's name exactly
#   Allowed action must include `npm publish`.
# The package already has 1.0.0 on npm, which satisfies npm's rule that a first version be
# published before a Trusted Publisher can be configured.
#
# Until that is configured the npm step is skipped, not failed, so the registry publish still
# runs and still reports honestly. Set the repo variable NPM_TRUSTED_PUBLISHING to `true` to turn
# it on.
#
# Trigger: a v* tag. To publish a new version, bump `version` in BOTH package.json and
# server.json, tag it, push the tag.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required: this is what makes OIDC work
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # server.json carries the version the registry records, and it is easy to tag v1.0.1
      # while server.json still says 1.0.0. Fail loudly rather than publish a lie.
      - name: Check the tag matches server.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          JSON_VERSION="$(jq -r .version server.json)"
          PKG_VERSION="$(jq -r .version package.json)"
          echo "tag=$TAG_VERSION  server.json=$JSON_VERSION  package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$JSON_VERSION" ] || [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION disagrees with server.json ($JSON_VERSION) or package.json ($PKG_VERSION). Bump all three together."
            exit 1
          fi

      # The npm package must already be on the public registry, because the registry validates
      # the package reference in server.json. Catch it here with a clear message rather than
      # letting `mcp-publisher publish` fail with something less obvious.
      - name: Check the npm package is published
        run: |
          NAME="$(jq -r '.packages[0].identifier' server.json)"
          VERSION="$(jq -r '.packages[0].version' server.json)"
          echo "looking for $NAME@$VERSION on npm"
          if ! curl -sf "https://registry.npmjs.org/$(echo "$NAME" | sed 's|/|%2F|')" | jq -e --arg v "$VERSION" '.versions[$v]' >/dev/null; then
            echo "::error::$NAME@$VERSION is not on npm. The MCP Registry validates this reference, so publish the package first."
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0, and registry-url must be set
      # for the OIDC exchange to target the public registry.
      - name: Set up Node
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm via trusted publishing
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: |
          npm install -g npm@latest
          npm --version
          npm publish --access public

      - name: Say why npm was skipped
        if: vars.NPM_TRUSTED_PUBLISHING != 'true'
        run: |
          echo "::notice::npm publish skipped. The registry reads mcpName from the PUBLISHED tarball, so if this version is not on npm yet the registry step will fail with 'missing required mcpName field'. Configure Trusted Publisher on npmjs.com and set the repo variable NPM_TRUSTED_PUBLISHING=true, or publish by hand once. See PUBLISHING.md."

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish

      - name: Confirm the listing is live
        run: |
          NAME="$(jq -r .name server.json)"
          sleep 10
          curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=autorev" | jq -e --arg n "$NAME" '.servers[] | select(.name == $n)' \
            && echo "listed as $NAME" \
            || echo "::warning::Published, but $NAME is not searchable yet. Indexing can lag; re-check before assuming failure."
